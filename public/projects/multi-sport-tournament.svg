<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111d"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="table" x1="400" y1="300" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cupRed" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="cupBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5a9dff"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.65">
      <stop stop-color="#ffd180"/>
      <stop offset="0.55" stop-color="#ff9800"/>
      <stop offset="1" stop-color="#e65100"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="40" y="40" width="720" height="370" rx="16" fill="#1e293b" fill-opacity="0.55" stroke="#2EE6C5" stroke-opacity="0.25"/>

  <!-- Title -->
  <text x="400" y="88" text-anchor="middle" fill="#2EE6C5" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="0.04em">TOURNOI BAR MULTISPORT</text>
  <text x="400" y="118" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Beer Pong</text>

  <!-- Table -->
  <ellipse cx="400" cy="355" rx="290" ry="42" fill="url(#table)" stroke="#334155" stroke-width="2"/>
  <rect x="110" y="318" width="580" height="18" rx="4" fill="#334155"/>

  <!-- Red cups (left triangle) -->
  <g id="red-cups">
    <!-- Row 1 (back) -->
    <g transform="translate(175, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
    <g transform="translate(225, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
    <g transform="translate(275, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(200, 278)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
    <g transform="translate(250, 278)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
    <!-- Row 3 (front) -->
    <g transform="translate(225, 308)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupRed)" stroke="#ff8a80" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#ffcdd2" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- Blue cups (right triangle) -->
  <g id="blue-cups">
    <!-- Row 1 (back) -->
    <g transform="translate(491, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
    <g transform="translate(541, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
    <g transform="translate(591, 248)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(516, 278)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
    <g transform="translate(566, 278)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
    <!-- Row 3 (front) -->
    <g transform="translate(541, 308)">
      <path d="M0 0 L34 0 L30 52 Q17 58 4 52 Z" fill="url(#cupBlue)" stroke="#82b1ff" stroke-width="1.5"/>
      <ellipse cx="17" cy="4" rx="15" ry="4" fill="#bbdefb" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- Team labels -->
  <text x="242" y="395" text-anchor="middle" fill="#ef5350" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ROUGE</text>
  <text x="558" y="395" text-anchor="middle" fill="#42a5f5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BLEU</text>

  <!-- Orange ping pong ball -->
  <g filter="url(#glow)">
    <circle cx="400" cy="195" r="22" fill="url(#ball)" stroke="#ff6f00" stroke-width="1.5"/>
    <ellipse cx="392" cy="186" rx="7" ry="4" fill="#fff3e0" fill-opacity="0.55" transform="rotate(-25 392 186)"/>
    <!-- Motion arc -->
    <path d="M320 230 Q400 150 480 230" stroke="#ff9800" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  </g>

  <!-- Decorative accent lines -->
  <line x1="60" y1="420" x2="740" y2="420" stroke="#2EE6C5" stroke-opacity="0.15" stroke-width="1"/>
</svg>
